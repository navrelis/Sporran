name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build release jar
        run: ./gradlew remapJar -Pbuild.release=true
      - name: Attach jar to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(build/libs/Sporran-*.jar)
          jars=()
          for f in "${files[@]}"; do
            case "$f" in
              *-sources.jar|*-all.jar|*-cichlid-libs.jar) ;;
              *) jars+=("$f") ;;
            esac
          done
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No release jar found in build/libs" >&2
            exit 1
          fi
          gh release upload "${{ github.event.release.tag_name }}" "${jars[@]}" --clobber --repo "${{ github.repository }}"
